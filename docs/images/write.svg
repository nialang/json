<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 384" width="780" height="384" role="img" aria-label="Writing throughput relative to yyjson">
<style>
  .title { font: 600 16px system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #18161b; }
  .note { font: 12px system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #5f5a66; }
  .label { font: 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #18161b; }
  .value { font: 11px system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #18161b; paint-order: stroke;
           stroke: #ffffff; stroke-width: 3px; stroke-linejoin: round; }
  .tick { font: 11px system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #5f5a66; }
  .grid { stroke: #ece9ef; stroke-width: 1; }
  .baseline { stroke: #18161b; stroke-width: 1.5; stroke-dasharray: 4 3; }
  .json { fill: #b8235a; }
  .serde { fill: #a19aa8; }
</style>
<rect x="0.5" y="0.5" width="779" height="383" rx="8" fill="#ffffff" stroke="#e4e0e8"/>
<text class="title" x="18" y="34">Writing throughput relative to yyjson</text>
<text class="note" x="18" y="54">Median of five processes on Linux, Intel Core i9-13900HX. Higher is faster.</text>
