<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 528" width="780" height="528" role="img" aria-label="Parsing throughput relative to yyjson">
<style>
  .title { font: 600 16px system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #18161b; }
