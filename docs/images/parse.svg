  .baseline { stroke: #18161b; stroke-width: 1.5; stroke-dasharray: 4 3; }
  .json { fill: #b8235a; }
  .serde { fill: #a19aa8; }
</style>
<rect x="0.5" y="0.5" width="779" height="527" rx="8" fill="#ffffff" stroke="#e4e0e8"/>
<text class="title" x="18" y="34">Parsing throughput relative to yyjson</text>
<text class="note" x="18" y="54">Median of five processes on Linux, Intel Core i9-13900HX. Higher is faster.</text>
